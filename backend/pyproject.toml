[project]
name = "rasto"
version = "0.1.0"
description = "Plataforma de gestão e ligação entre startups aceleradas e investidores em Angola"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "django-allauth[mfa]>=65,<66",
  "django-axes>=8,<10",
  "django-csp>=4,<5",
  "argon2-cffi>=23",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.7",
  "gunicorn>=22",
  "djangorestframework>=3.15,<4",
  "drf-spectacular>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "factory-boy>=3.3", "hypothesis>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "E501", "DJ008"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rasto*", "config*"]
