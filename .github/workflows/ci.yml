name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: rasto, POSTGRES_USER: rasto, POSTGRES_PASSWORD: rasto }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rasto" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DJANGO_SECRET_KEY: ci-apenas
      DJANGO_DEBUG: "1"
      PGHOST: localhost
      PGPORT: "5433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]" pip-audit
      - name: Lint
        run: ruff check .
      - name: Migrações em falta
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: pytest
      - name: Verificação de implantação
        env: { DJANGO_DEBUG: "0", DJANGO_ALLOWED_HOSTS: rasto.example }
        run: python manage.py check --deploy --fail-level WARNING
      - name: Dependências vulneráveis
        run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  imagem:
    needs: [testes, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rasto-api:${{ github.sha }} backend
      - run: docker build -t rasto-frontend:${{ github.sha }} frontend
