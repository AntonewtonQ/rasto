name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: rasto, POSTGRES_USER: rasto, POSTGRES_PASSWORD: rasto }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rasto" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DJANGO_SECRET_KEY: ci-apenas
      DJANGO_DEBUG: "1"
      PGHOST: localhost
      PGPORT: "5433"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ".[dev]" pip-audit
      - name: Lint
        run: ruff check .
      - name: Migrações em falta
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: pytest
      - name: Verificação de implantação
        env: { DJANGO_DEBUG: "0", DJANGO_ALLOWED_HOSTS: rasto.example }
        # Chave aleatória só para este passo: a de cima é curta de propósito e falharia o security.W009.
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python manage.py check --deploy --fail-level WARNING
      - name: Dependências vulneráveis
        run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  e2e:
    needs: [testes, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: rasto, POSTGRES_USER: rasto, POSTGRES_PASSWORD: rasto }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rasto" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-apenas
      DJANGO_DEBUG: "1"
      PGHOST: localhost
      PGPORT: "5433"
      EMAIL_FICHEIROS: /tmp/rasto-emails
      BACKEND_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend com dados de demonstração
        working-directory: backend
        run: |
          pip install -e .
          python manage.py migrate --noinput
          python manage.py semear_demo
          mkdir -p "$EMAIL_FICHEIROS"
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run start > /tmp/next.log 2>&1 &
          npx playwright install --with-deps chromium
          npx --yes wait-on -t 60000 http://localhost:3000/entrar http://127.0.0.1:8000/saude
      - name: Testes ponta a ponta e acessibilidade
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report
            /tmp/django.log
            /tmp/next.log
  imagem:
    needs: [testes, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rasto-api:${{ github.sha }} backend
      - run: docker build -t rasto-frontend:${{ github.sha }} frontend
